name: Publish userscript to Gist

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-navigator-gist
  cancel-in-progress: false
  # Keep pending releases queued: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  queue: max

jobs:
  publish:
    if: github.repository == 'Fucose/chatgpt-conversation-navigator'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Select release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          PUSH_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == 'push' && "$PUSH_REF" == refs/tags/* ]]; then
            tag="${PUSH_REF#refs/tags/}"
            checkout_ref="$PUSH_SHA"
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            tag="$INPUT_TAG"
            checkout_ref="refs/tags/$tag"
          else
            echo 'Expected a tag push or a manual release tag.' >&2
            exit 1
          fi

          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tag must have the format vX.Y.Z without leading zeroes.' >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"

      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Check userscript syntax
        run: node --check chatgpt-conversation-navigator.user.js

      - name: Run tests
        run: node --test

      - name: Publish and verify
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node .github/scripts/publish-gist.cjs
